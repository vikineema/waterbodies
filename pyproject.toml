[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "waterbodies"
# version = "0.0.1"
authors = [{name = "Digital Earth Africa", email = "systems@digitalearthafrica.org"}]
maintainers = [{name = "Digital Earth Africa", email = "systems@digitalearthafrica.org"}]
description = "DE Africa waterbodies"
readme =  {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10,<3.14"
dynamic = ["version"]
dependencies = [
    "click",
    "datacube[s3, performance]>=1.9.0",
    "fsspec>=2026.1.0",
    "geoalchemy2",
    "geopandas",
    "numpy",
    "odc-dscache",
    "odc-geo",
    "odc-stats",
    "pandas",
    "python-dotenv",
    "python-geohash",
    "rasterio",
    "rioxarray",
    "s3fs>=2026.1.0",
    "scikit-image",
    "sqlalchemy",
    "alembic",
    "toolz",
    "tqdm",
    "xarray",
]

[project.optional-dependencies]
tests = [
    "pytest",
    "coverage",
    "odc-apps-dc-tools>=1.9.7",
]
lint = [
    "ruff",
    "pre-commit",
]
viz = ["lxml"]
dev = ["waterbodies[tests, lint, viz]"]

[project.urls]
Repository = "https://github.com/digitalearthafrica/waterbodies.git"
"Bug Tracker" = "https://github.com/digitalearthafrica/waterbodies/issues"

[project.scripts]
waterbodies = "waterbodies.cli.main:waterbodies"

[tool.setuptools]
packages = ["waterbodies"]

[tool.setuptools.dynamic]
version = {attr = "waterbodies.__version__"}

[tool.setuptools_scm]
version_file = "waterbodies/_version.py"

[tool.ruff]
line-length = 100
target-version = "py310" # Set this to your python version

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203", "E701"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
